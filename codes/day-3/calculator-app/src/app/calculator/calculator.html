<h2>{{title()}}</h2>
<br>
<br>
<form>
    <fieldset>
        <legend>Calculator</legend>
        <div>
            <label for="radioAdd">Add:&nbsp;</label>
            <input type="radio" name="calculation" id="radioAdd" (change)="choice.set(1)">
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

            <label for="radioSub">Subtract:&nbsp;</label>
            <input type="radio" name="calculation" id="radioSub" (change)="choice.set(2)">
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

            <label for="radioMulti">Multiply:&nbsp;</label>
            <input type="radio" name="calculation" id="radioMulti" (change)="choice.set(3)">
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

            <label for="radioDiv">Divide:&nbsp;</label>
            <input type="radio" name="calculation" id="radioDiv" (change)="choice.set(4)">
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        </div>
        <div>
            <label for="txtFirst">First:&nbsp;</label>
            <input type="text" name="calculation" id="txtFirst" [value]="first()"
                (input)="first.set(+$event.target.value)">
        </div>
        <div>
            <label for="txtSecond">First:&nbsp;</label>
            <input type="text" name="calculation" id="txtSecond" [value]="second()"
                (input)="second.set(+$event.target.value)">
        </div>
        <div>
            <button type="button" (click)="calculate()" id="btnCalculate">Calculate</button>
        </div>
        <div>
            <label for="txtResult">Result:&nbsp;</label>
            <input type="text" name="calculation" id="txtResult" readonly value="{{result()}}">
        </div>
    </fieldset>
</form>
